<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./dist/output.css">
    <script src="/frontend/js/peminjam.js"></script>
</head>
<body>
    <header class="bg-blue-300 shadow-sm sticky top-0 z-50">
        <div class="max-w-7xl mx-auto flex justify-between items-center px-6 py-4">
            <h3 class="font-bold text-2xl ">Dasboard peminjaman</h3>
            <nav>
                <ul>
                    <li class="flex gap-4">
                        <a href="index.html" class="hover:text-black hover:bg-gray-300 shadow-md transition-all duration-300 font-bold border-4 border-white bg-white hover:border-gray-200 rounded-lg ">Halaman utama</a>
                        <a href="alat.html" class="hover:text-black hover:bg-gray-300 shadow-md transition-all duration-300 font-bold border-4 border-white bg-white hover:border-gray-200 rounded-lg ">Alat</a>
                        <a href="kategori.html" class="hover:text-black hover:bg-gray-300 shadow-md transition-all duration-300 font-bold border-4 border-white bg-white hover:border-gray-200 rounded-lg ">Kategori</a>
                    </li>
                </ul>
            </nav>
        </div>
    </header>
    <main>
        <div class="bg-white border border-gray-300 rounded-lg p-5 col-span-2">
                <div class="flex items-center justify-between border-b border-gray-200 pb-2 mb-4">
                    <h2 class="text-base font-bold text-gray-900">Daftar peminjam</h2>
                    <span id="alat-total" class="text-xs bg-gray-100 text-gray-600 px-2 py-1 rounded font-semibold">0 Data</span>
                </div>

                <div class="overflow-x-auto">
                    <table class="w-full text-left text-sm border border-gray-200">
                        <thead class="bg-gray-100 text-gray-700 text-xs uppercase font-semibold border-b border-gray-200">
                            <tr>
                                <th class="py-2 px-3 text-center w-12">ID peminjam</th>
                                <th class="py-2 px-3 ">ID Alat</th>
                                <th class="py-2 px-3 ">Nama peminjam</th>
                                <th class="py-2 px-3 text-center">kelas</th>
                                <th class="py-2 px-3 text-center ">tanggal pinjam</th>
                                <th class="py-2 px-3">tanggal kembali</th>
                                <th class="py-2 px-3 text-center">jumlah</th>
                                <th class="py-2 px-3 text-center w-32">status</th>
                                <th class="py-2 px-3 text-center w-32">aksi</th>
                            </tr>
                        </thead>
                        <tbody id="tbody-peminjaman" class="divide-y divide-gray-200">
                        </tbody>
                    </table>
                </div>
            </div>
    </main>
</body>
</html>
